<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse · my-bot</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.pulse-page {
      --bar-dur: 0.8s;
      --heart-dur: 1.2s;
      background: #0a0a0f;
      color: #fdf2f8;
    }
    .pulse-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(236, 72, 153, 0.25), transparent 55%),
        radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.2), transparent 40%);
      pointer-events: none;
    }
    .pulse-hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 0 1rem;
    }
    .pulse-hero h1 {
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #f472b6, #c084fc, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .heartbeat-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1.5rem 0 2rem;
      min-height: 100px;
    }
    .heart {
      width: 64px;
      height: 64px;
      background: #ec4899;
      transform: rotate(-45deg);
      position: relative;
      animation: heartbeat var(--heart-dur) ease-in-out infinite;
      box-shadow: 0 0 30px #ec489988;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 64px;
      height: 64px;
      background: #ec4899;
      border-radius: 50%;
    }
    .heart::before { top: -32px; left: 0; }
    .heart::after { top: 0; left: 32px; }
    @keyframes heartbeat {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      15% { transform: rotate(-45deg) scale(1.18); }
      30% { transform: rotate(-45deg) scale(1); }
      45% { transform: rotate(-45deg) scale(1.12); }
      60% { transform: rotate(-45deg) scale(1); }
    }
    .viz {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      height: 160px;
      padding: 0 0.5rem;
      margin: 0 auto;
      max-width: 520px;
    }
    .bar {
      flex: 1;
      max-width: 18px;
      min-width: 6px;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, #22d3ee, #a855f7, #ec4899);
      transform-origin: bottom;
      animation: bounce var(--bar-dur) ease-in-out infinite alternate;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.35);
    }
    @keyframes bounce {
      from { transform: scaleY(0.25); opacity: 0.7; }
      to { transform: scaleY(1); opacity: 1; }
    }
    .controls {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .controls button,
    .controls a {
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      border: 1px solid rgba(244, 114, 182, 0.4);
      background: rgba(236, 72, 153, 0.15);
      color: #fce7f3;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .controls button:hover,
    .controls a:hover {
      background: rgba(236, 72, 153, 0.35);
      transform: translateY(-2px);
    }
    .controls button.is-active {
      background: rgba(236, 72, 153, 0.45);
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.45);
      border-color: rgba(251, 207, 232, 0.7);
    }
    .meta {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: rgba(252, 231, 243, 0.5);
    }
  </style>
</head>
<body class="pulse-page">
  <div class="pulse-bg" aria-hidden="true"></div>

  <nav class="site-nav">
    <a class="brand" href="index.html"><span class="dot"></span><span class="label">my-bot</span></a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="neon.html">Neon</a>
      <a href="aurora.html">Aurora</a>
      <a href="orbit.html">Orbit</a>
      <a class="active" href="pulse.html">Pulse</a>
    </div>
  </nav>

  <main class="page-wrap">
    <div class="container">
      <div class="pulse-hero">
        <p class="eyebrow">Visualizer · No Audio Needed</p>
        <h1>Pulse</h1>
        <p class="tagline" style="margin: 0.75rem auto 0; text-align: center;">
          心跳 + 频谱条 · CSS 律动 · 可调快慢
        </p>
      </div>

      <div class="heartbeat-wrap">
        <div class="heart" aria-hidden="true"></div>
      </div>

      <div class="viz" id="viz" aria-label="Fake equalizer bars"></div>

      <div class="controls">
        <button type="button" id="slowBtn" data-speed="slow">Slow</button>
        <button type="button" id="normBtn" data-speed="normal" class="is-active">Normal</button>
        <button type="button" id="fastBtn" data-speed="fast">Fast</button>
        <a href="index.html">← Home</a>
        <a href="orbit.html">Orbit</a>
      </div>

      <p class="meta" id="meta">BPM vibe · Normal</p>
      <p class="footer-note">Pulse World · my-bot</p>
    </div>
  </main>

  <script>
    (function () {
      var root = document.body;
      var viz = document.getElementById("viz");
      var meta = document.getElementById("meta");
      var heart = document.querySelector(".heart");
      var speeds = {
        slow: { bar: "1.7s", heart: "2.1s", label: "Slow" },
        normal: { bar: "0.8s", heart: "1.2s", label: "Normal" },
        fast: { bar: "0.32s", heart: "0.55s", label: "Fast" }
      };
      var n = 24;
      for (var i = 0; i < n; i++) {
        var b = document.createElement("div");
        b.className = "bar";
        b.style.height = 40 + Math.random() * 60 + "%";
        b.dataset.delay = (i * 0.07) + "s";
        viz.appendChild(b);
      }

      function applyAnim(el, value) {
        el.style.animation = "none";
        // Force reflow so the browser drops the old timeline
        void el.offsetWidth;
        el.style.animation = value;
      }

      function setSpeed(key) {
        var cfg = speeds[key] || speeds.normal;
        root.style.setProperty("--bar-dur", cfg.bar);
        root.style.setProperty("--heart-dur", cfg.heart);
        meta.textContent = "BPM vibe · " + cfg.label;

        applyAnim(heart, "heartbeat " + cfg.heart + " ease-in-out infinite");

        var bars = viz.querySelectorAll(".bar");
        for (var i = 0; i < bars.length; i++) {
          var delay = bars[i].dataset.delay || "0s";
          applyAnim(
            bars[i],
            "bounce " + cfg.bar + " ease-in-out " + delay + " infinite alternate"
          );
        }

        document.querySelectorAll(".controls button[data-speed]").forEach(function (btn) {
          btn.classList.toggle("is-active", btn.getAttribute("data-speed") === key);
        });
      }

      document.getElementById("slowBtn").addEventListener("click", function () { setSpeed("slow"); });
      document.getElementById("normBtn").addEventListener("click", function () { setSpeed("normal"); });
      document.getElementById("fastBtn").addEventListener("click", function () { setSpeed("fast"); });

      // Apply default so inline restart path is used from the start
      setSpeed("normal");
    })();
  </script>
</body>
</html>
